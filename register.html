<!DOCTYPE html>
<html data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Coffee House</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 1s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center">
    <div class="absolute inset-0 opacity-20">
        <div class="absolute top-0 left-0 w-96 h-96 bg-amber-500 rounded-full filter blur-[100px] transform -translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-amber-500 rounded-full filter blur-[100px] transform translate-x-1/2 translate-y-1/2"></div>
    </div>

    <div class="relative z-10 w-full max-w-md p-8">
        <div class="group relative p-8 rounded-2xl bg-black/30 backdrop-blur-sm shadow-2xl hover:shadow-amber-500/30 transition-all duration-700 border border-gray-800 hover:border-amber-500/30 transform hover:-translate-y-2 animate-fade-in">
            <div class="text-center mb-8">
                <img src="./img/logo/Coffee-house-logo-design-illustration-vector-removebg-preview.png" class="w-20 h-20 mx-auto mb-4" alt="Logo">
                <h2 class="text-3xl font-bold text-amber-500 mb-2">Create Account</h2>
                <p class="text-gray-400">Join our coffee community</p>
            </div>

            <form class="space-y-6">
                <div class="group">
                    <label class="block text-gray-400 mb-2 group-hover:text-amber-500 transition duration-300">Full Name</label>
                    <input type="text" class="w-full px-4 py-3 rounded-lg bg-black/50 border border-gray-800 focus:border-amber-500 focus:ring-2 focus:ring-amber-500/30 text-white transition duration-300" placeholder="Enter your full name">
                </div>
                <div class="group">
                    <label class="block text-gray-400 mb-2 group-hover:text-amber-500 transition duration-300">Email Address</label>
                    <input type="email" class="w-full px-4 py-3 rounded-lg bg-black/50 border border-gray-800 focus:border-amber-500 focus:ring-2 focus:ring-amber-500/30 text-white transition duration-300" placeholder="Enter your email">
                </div>
                <div class="group">
                    <label class="block text-gray-400 mb-2 group-hover:text-amber-500 transition duration-300">Password</label>
                    <input type="password" class="w-full px-4 py-3 rounded-lg bg-black/50 border border-gray-800 focus:border-amber-500 focus:ring-2 focus:ring-amber-500/30 text-white transition duration-300" placeholder="Create a password">
                </div>
                <div class="group">
                    <label class="block text-gray-400 mb-2 group-hover:text-amber-500 transition duration-300">Confirm Password</label>
                    <input type="password" class="w-full px-4 py-3 rounded-lg bg-black/50 border border-gray-800 focus:border-amber-500 focus:ring-2 focus:ring-amber-500/30 text-white transition duration-300" placeholder="Confirm your password">
                </div>
                <div class="flex items-center">
                    <input type="checkbox" class="w-4 h-4 text-amber-500 bg-black/50 border-gray-800 rounded focus:ring-amber-500">
                    <label class="ml-2 text-gray-400">I agree to the <a href="#" class="text-amber-500 hover:text-amber-400">Terms & Conditions</a></label>
                </div>
                <button type="submit" class="w-full bg-amber-500 text-white px-6 py-3 rounded-lg hover:bg-amber-600 transition-all duration-300 transform hover:scale-105 hover:shadow-lg hover:shadow-amber-500/30 flex items-center justify-center space-x-2">
                    <span>Create Account</span>
                    <i class="fas fa-arrow-right transform group-hover:translate-x-1 transition duration-300"></i>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-400">
                    Already have an account? 
                    <a href="login.html" class="text-amber-500 hover:text-amber-400 transition duration-300">Sign in</a>
                </p>
                <a href="coffe.html" class="mt-4 inline-flex items-center text-gray-400 hover:text-amber-500 transition duration-300">
                    <i class="fas fa-arrow-left mr-2"></i>
                    Back to Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
